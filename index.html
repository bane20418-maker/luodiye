<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2DROP - 官方正版饰品秒到账</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-color: #1f2833;
            --primary-color: #ff9f1c;
            --text-color: #c5a880;
            --text-light: #ffffff;
            --accent-color: #45f3ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: linear-gradient(180deg, #131419 0%, #0b0c10 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 80px;
            border-left: 1px solid #222;
            border-right: 1px solid #222;
        }

        /* 头部样式 */
        header {
            padding: 20px 15px;
            text-align: center;
            border-bottom: 1px solid #1a1c23;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 159, 28, 0.5);
        }

        .tagline {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        /* 促销 Banner 样式 */
        .promo-banner {
            margin: 15px;
            background: linear-gradient(135deg, #1e1b4b 0%, #311042 100%);
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            padding: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 159, 28, 0.2);
            cursor: pointer;
        }

        .promo-banner::before {
            content: '限时福利';
            position: absolute;
            top: 0;
            right: 0;
            background: var(--primary-color);
            color: #000;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 10px;
            border-bottom-left-radius: 8px;
        }

        .promo-title {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, var(--primary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .promo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .promo-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 159, 28, 0.2);
            border-radius: 6px;
            padding: 8px 4px;
            text-align: center;
        }

        .promo-item.full-width {
            grid-column: span 3;
            background: rgba(255, 159, 28, 0.1);
            border: 1px dashed var(--primary-color);
        }

        .charge-txt {
            font-size: 11px;
            color: #aaa;
            display: block;
        }

        .give-txt {
            font-size: 14px;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 2px;
        }

        .promo-item.full-width .give-txt {
            color: #ff4d4d;
            font-size: 16px;
            text-shadow: 0 0 8px rgba(255, 77, 77, 0.4);
        }

        /* 核心利益钩子 */
        .hook-box {
            background: rgba(255, 159, 28, 0.05);
            border-top: 1px solid rgba(255, 159, 28, 0.1);
            border-bottom: 1px solid rgba(255, 159, 28, 0.1);
            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
        }

        .hook-box h2 {
            font-size: 16px;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .hook-box p {
            font-size: 13px;
            color: #ddd;
        }

        /* 标签栏 */
        .nav-tags {
            display: flex;
            justify-content: space-around;
            padding: 0 15px;
            margin-bottom: 20px;
        }

        .tag {
            background: #1a1c23;
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #2a2d38;
        }

        /* 武器箱区域 */
        .section-title {
            padding: 0 15px;
            font-size: 15px;
            color: #888;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 15px;
            background: var(--primary-color);
            margin-right: 8px;
        }

        .box-list {
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .box-card {
            background: #16181f;
            border: 1px solid #232631;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s;
            cursor: pointer;
        }

        .box-card:hover {
            border-color: var(--primary-color);
            background: #1c1f29;
        }

        .box-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .box-icon {
            font-size: 24px;
            background: #202330;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 1px solid #2d3142;
        }

        .box-name {
            font-size: 15px;
            font-weight: bold;
            color: #fff;
        }

        .box-price {
            font-size: 14px;
            color: var(--primary-color);
            margin-top: 4px;
            font-weight: bold;
        }

        .btn-open {
            background: linear-gradient(90deg, #ff7b00, #ff9f1c);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 底部固定转化按钮 */
        .footer-cta {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 15px;
            border-top: 1px solid #222;
            z-index: 100;
        }

        .btn-main {
            width: 100%;
            background: linear-gradient(90deg, #ff9f1c, #ff7b00);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 159, 28, 0.4);
            text-align: center;
            text-decoration: none;
            display: block;
        }
    </style>
</head>
<body>

        <header>

            <!-- 武器箱 3 -->
            <div class="box-card">

                <button class="btn-open">立即开箱</button>

        </div>

        <div class="footer-cta">
            <a href="javascript:void(0);" class="btn-main">快捷登录 / 领取免费开箱福利</a>
        </div>
    </div>

    <script>

</body>
</html>
